[project]
name = "fantasy-football-lab"
version = "1.0.0"
description = "A kid-friendly Jupyter lab for analyzing fantasy football stats"
requires-python = ">=3.12"
dependencies = [
    "jupyterlab>=4.2",
    "nflreadpy",
    "pandas>=2.2",
    "pyarrow",
    "plotly>=5.24",
    "ipywidgets>=8.1",
    "nbformat>=5.10",
    "nbconvert>=7.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ffkit"]
